# Command-line entry for creating migrations (autogenerate against the SQLite file).
# The application applies migrations itself on startup; see infrastructure/persistence/sqlite.py.
[alembic]
script_location = src/claims_assistant/infrastructure/persistence/migrations
sqlalchemy.url = sqlite+pysqlite:///data/claims.sqlite3
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
