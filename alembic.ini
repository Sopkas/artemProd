# Command-line entry for creating migrations (autogenerate against the SQLite file) and for
# `alembic downgrade` on a rollback. The application applies migrations itself on startup;
# see infrastructure/persistence/sqlite.py. The CLI works on DATABASE_PATH (environment,
# then .env) like the bot; the url below is only the fallback when neither sets it.
[alembic]
script_location = src/claims_assistant/infrastructure/persistence/migrations
sqlalchemy.url = sqlite+pysqlite:///data/claims.sqlite3
prepend_sys_path = src
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
