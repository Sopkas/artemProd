name: CI

# Minutes cost money on a private repository: the free plan has 2000 a month, every job is
# billed in whole minutes, and a Windows minute counts twice. In September 2026 the old
# setup ran each change twice (push + pull_request) with a Windows job every time — about
# 12 billed minutes per push — and the quota ran out on the 23rd. So:
#
# - a pull request is checked once, on the pull_request event; push runs only for main;
# - the Windows job (4 of the 6 minutes of a full run) runs after merge, on the manual
#   button, or on a pull request labelled «windows» — the developer on Windows runs the
#   same checks locally before every push anyway;
# - a change that touches only documentation is not checked at all.
#
# A pull request push now costs about 2 minutes instead of 12.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    # «labeled» so that putting the «windows» label on a PR runs the Windows job for it.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    # Adding some other label to a PR must not re-run the whole suite.
    if: github.event.action != 'labeled' || github.event.label.name == 'windows'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 3.12 and 3.14 — the oldest and the newest supported Python — always;
        # Windows 3.13 everywhere except a pull request without the «windows» label.
        include: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'windows') && '[{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.14"}]' || '[{"os":"ubuntu-latest","python-version":"3.12"},{"os":"ubuntu-latest","python-version":"3.14"},{"os":"windows-latest","python-version":"3.13"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Test without real credentials
        run: python -m pytest -q
      - name: Check installed entry point without configuration
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile

          env = os.environ.copy()
          for key in ("TELEGRAM_BOT_TOKEN", "ALLOWED_TELEGRAM_IDS", "LOG_LEVEL"):
              env.pop(key, None)
          with tempfile.TemporaryDirectory() as directory:
              result = subprocess.run(
                  [sys.executable, "-m", "claims_assistant"],
                  cwd=directory, env=env, capture_output=True, text=True,
              )
          assert result.returncode == 2, result.returncode
          assert "TELEGRAM_BOT_TOKEN" in result.stderr
          print("Entry point correctly rejects missing configuration.")
          PY
