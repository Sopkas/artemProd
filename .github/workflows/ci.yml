name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies and package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Test without real credentials
        run: python -m pytest -q
      - name: Check installed entry point without configuration
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile

          env = os.environ.copy()
          for key in ("TELEGRAM_BOT_TOKEN", "ALLOWED_TELEGRAM_IDS", "LOG_LEVEL"):
              env.pop(key, None)
          with tempfile.TemporaryDirectory() as directory:
              result = subprocess.run(
                  [sys.executable, "-m", "claims_assistant"],
                  cwd=directory, env=env, capture_output=True, text=True,
              )
          assert result.returncode == 2, result.returncode
          assert "TELEGRAM_BOT_TOKEN" in result.stderr
          print("Entry point correctly rejects missing configuration.")
          PY
