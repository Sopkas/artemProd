[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-assistant"
version = "0.1.0"
description = "Telegram shell for the claims assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31,<4",
    "alembic>=1.13,<2",
    "openpyxl>=3.1,<4",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["claims_assistant*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
